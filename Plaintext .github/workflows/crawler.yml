name: Atualização Horária do Radar Policial

on:
  schedule:
    # Executa automaticamente no minuto zero de cada hora (24/7)
    - cron: '0 * * * *'
  # Permite disparar manualmente pelo botão "Run workflow"
  workflow_dispatch:

jobs:
  update-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Executar Varredura Policial
        run: |
          python crawler.py

      - name: Salvar e Publicar Dados Atualizados
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add radar_noticias.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: atualização horária do radar policial [skip ci]" && git push)
